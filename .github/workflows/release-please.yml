name: Version and tag

# Runs on every push to main. If the new commits contain feat: or fix: changes,
# release-please (config: release-please-config.json) bumps the version, writes
# CHANGELOG.md from the commit subjects, keeps the four package.json files and both
# lockfiles in step, commits that, and pushes the tag v<version>.
# The tag then triggers release-desktop.yml, which builds and publishes the Windows app.
# A push without feat:/fix: commits does nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
