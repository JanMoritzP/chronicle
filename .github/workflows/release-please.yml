name: Version and tag

# Runs on every push to main. If the new commits contain feat: or fix: changes,
# release-please bumps the version, writes CHANGELOG.md from the commit subjects,
# keeps the four package.json files and both lockfiles in step (rules in
# release-please-config.json), updates .release-please-manifest.json, commits that,
# and pushes the tag v<version>.
# The tag then triggers release-desktop.yml, which builds and publishes the Windows app.
# A push without feat:/fix: commits does nothing.
#
# The action only reads release-please-config.json in multi-manifest mode, which
# requires the .release-please-manifest.json file next to it. Do not "simplify" this
# away: the single-manifest format is ignored by the action (see AGENTS.md, section 8).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
