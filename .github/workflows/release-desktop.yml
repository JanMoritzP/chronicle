name: Desktop release

# Runs on every v* tag (the Release workflow pushes the tag after a feat:/fix:
# commit on main, see release.yml). The tag must equal electron/package.json "version".
# Builds the Windows app and publishes it as a GitHub release: installer, portable exe, latest.yml and blockmap.
# The installed app updates itself from latest.yml; the portable app picks the *-portable.exe from the same release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match the app version
        shell: bash
        run: |
          v=$(node -p "require('./electron/package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match electron/package.json version $v"; exit 1; fi
      # --ignore-scripts: the root workspace's native deps (better-sqlite3, esbuild,
      # sharp) ship prebuilt binaries; letting npm run install scripts made the
      # Windows runner compile them and fail. The electron workspace keeps its
      # scripts (the electron package downloads its binary in postinstall).
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: electron
      - name: Test updater logic
        run: node scripts/test-update-logic.mjs
      # Write the notes file and create the release (with the notes as its body)
      # before the builder runs, so the release page and the update dialogs show
      # the notes and the builder only attaches assets to the existing release.
      - run: node scripts/extract-release-notes.mjs
      - run: node scripts/publish-release.mjs
      - name: Build and publish
        working-directory: electron
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # re-running a tag must be able to attach assets to the existing
          # release, not skip publishing because it is older than 2 hours
          EP_GH_IGNORE_TIME: 'true'
