name: Desktop release

# Runs on every v* tag (release-please pushes the tag after a feat:/fix: commit on main,
# see release-please.yml). The tag must equal electron/package.json "version".
# Builds the Windows app and publishes it as a GitHub release: installer, portable exe, latest.yml and blockmap.
# The installed app updates itself from latest.yml; the portable app picks the *-portable.exe from the same release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match the app version
        shell: bash
        run: |
          v=$(node -p "require('./electron/package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match electron/package.json version $v"; exit 1; fi
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - name: Test updater logic
        run: node scripts/test-update-logic.mjs
      - name: Build and publish
        working-directory: electron
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
