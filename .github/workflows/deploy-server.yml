name: Deploy server

# Runs on the self-hosted runner that lives on the machine hosting Chronicle:
# checks out the release tag and rebuilds the container with Docker Compose. The
# named volume is kept, so the database, uploads and backups survive; migrations
# run on start. Started by release.yml for every new release (a push made with
# GITHUB_TOKEN does not start workflows, so it is dispatched explicitly), or by
# hand from the Actions tab.
#
# Never give a pull_request trigger to a job that uses this runner: the repo is
# public, and a pull request from a fork would run its code on your server.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, chronicle-server]
    timeout-minutes: 30
    env:
      # Must match the project the data volume belongs to: `docker volume ls`
      # shows <project>_chronicle-data. A different name starts an empty volume.
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'chronicle' }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and restart
        shell: bash
        # --wait fails the job when the container never turns healthy
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Show state
        if: always()
        shell: bash
        run: |
          docker compose ps
          docker image prune -f
