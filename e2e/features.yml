# The catalog of what Chronicle can do, and whether an end-to-end test covers it.
#
# To say "this should be tested", add a line under an area:
#
#   - id: maps.journeys            # unique, lower case, dots and dashes
#     name: Journeys on a line     # what you would call it
#     files: [web/src/components/MapView.tsx]   # optional: where it lives, to show how much of that code ran
#     status: planned              # optional: marks it as a known gap instead of an unnoticed one
#     note: Needs a map with two pins first.    # optional
#
# A test covers a feature when it carries the same id: test('...', { tag: '@feature:maps.journeys' }, ...)
# The dashboard (npm run report in e2e/) shows tested, failing, not tested yet and planned features.

