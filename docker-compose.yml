services:
  chronicle:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
      # The admin dashboard (who can open which world). Reachable from your network; never forward this port to the internet.
      # To allow this machine only, use "127.0.0.1:3001:3001".
      - "3001:3001"
    environment:
      # Only used on the very first start to create the owner account. Change it in the app afterwards, then remove it.
      ADMIN_PASSWORD: "password"
      ADMIN_USER: "gm"
      # Only used on the very first start to create the dashboard account (user "admin"). Without it the dashboard stays off.
      ADMIN_PANEL_PASSWORD: "password"
    volumes:
      # A named volume, not a folder: SQLite is unreliable on bind mounts from the Windows file system.
      - chronicle-data:/data

volumes:
  chronicle-data:
